<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mieux se connaître</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="overlay"></div>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-md-10">

                <section class="formulaire-card">

                    <div class="text-center mb-4">

                        <div class="logo-circle">

                            <i class="bi bi-person-heart"></i>

                        </div>

                        <h1 class="titre-formulaire">

                            Mieux se connaître

                        </h1>

                        <p class="sous-titre">

                            Crée ton profil d'intégration

                        </p>

                    </div>

                    <form id="formulaire">

                        <div class="champ mb-3">

                            <label for="nom" class="form-label">
                                Nom
                            </label>

                            <div class="position-relative">

                                <input
                                    type="text"
                                    id="nom"
                                    class="form-control">

                                <i class="icone-validation"></i>

                            </div>

                            <small class="message-erreur"></small>

                        </div>

                    

                        <div class="champ mb-3">

                            <label for="prenom" class="form-label">
                              Prénom
                            </label>

                            <div class="position-relative">

                                <input type="text" id="prenom" class="form-control">

                                <i class="icone-validation"></i>

                            </div>

                            <small class="message-erreur"></small>

                        </div>

                      

                        <div class="champ mb-3">

                            <label for="email"nclass="form-label"> 
                                Email 
                            </label>

                            <div class="position-relative">

                                <input type="email" id="email" class="form-control">

                                <i class="icone-validation"></i>

                            </div>

                            <small class="message-erreur"></small>

                        </div>

                        <!-- DOMAINE -->

                        <div class="champ mb-4">

                            <label for="domaine" class="form-label">
                                Domaine de prédilection
                            </label>

                            <select id="domaine" class="form-select">

                                <option value="">

                                    Sélectionne ton domaine...

                                </option>

                                <option value="Front-End">

                                    Front-End

                                </option>

                                <option value="Back-End">

                                    Back-End

                                </option>

                                <option value="Design UX/UI">

                                    Design UX/UI

                                </option>

                                <option value="Data">

                                    Data

                                </option>

                            </select>

                            <small class="message-erreur"></small>

                        </div>

                        <!-- RYTHME -->

                        <div class="champ mb-4">

                            <label class="form-label d-block">

                                Tu es plutôt ?

                            </label>

                            <div class="form-check">

                                <input class="form-check-input" type="radio" name="rythme" value=" Early Bird">

                                <label class="form-check-label">

                                     Early Bird

                                </label>

                            </div>

                            <div class="form-check">

                                <input class="form-check-input" type="radio" name="rythme" value=" Night Owl">

                                <label class="form-check-label">

                                    Night Owl

                                </label>

                            </div>

                            <small class="message-erreur"></small>

                        </div>                       

                        <div class="champ mb-4">

                            <label class="form-label d-block">

                                Centres d'intérêt

                            </label>

                            <div class="row">

                                <div class="col-md-6">

                                    <div class="form-check">

                                        <input class="form-check-input passion"  type="checkbox"  value="Veille Tech">

                                        <label class="form-check-label">

                                            Veille Tech

                                        </label>

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <div class="form-check">

                                        <input class="form-check-input passion" type="checkbox" value="Gaming">

                                        <label class="form-check-label">

                                            Gaming

                                        </label>

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <div class="form-check">

                                        <input class="form-check-input passion" type="checkbox" value="Sport">

                                        <label class="form-check-label">

                                            Sport

                                        </label>

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <div class="form-check">

                                        <input class="form-check-input passion" type="checkbox" value="Musique">

                                        <label class="form-check-label">

                                            Musique

                                        </label>

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <div class="form-check">

                                        <input class="form-check-input passion" type="checkbox" value="Lecture">

                                        <label class="form-check-label">

                                            Lecture

                                        </label>

                                    </div>

                                </div>

                            </div>

                            <small class="message-erreur"></small>

                        </div>

                    

                        <div class="champ mb-4">

                            <label for="presentation" class="form-label">

                                Raconte-nous une anecdote drôle ou ton ambition ultime dans la tech

                            </label>

                            <textarea id="presentation" rows="5" maxlength="255" class="form-control" placeholder="Minimum 25 caractères..."></textarea>

                            <div class="text-end mt-1">

                                <small id="compteur">

                                    255 caractères restants

                                </small>

                            </div>

                            <small class="message-erreur"></small>

                        </div>

                       

                        <button type="submit" id="bouton-submit" class="btn bouton-envoi w-100" disabled>

                            <i class="bi bi-person-check-fill me-2"></i>
                            Créer mon profil

                        </button>

                    </form>

                </section>


                <section id="profil-cree">

                </section>

            </div>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
